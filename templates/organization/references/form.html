{% extends "core/base.html" %}

{% block content %}
  <form method="post" class="card" novalidate>
    {% csrf_token %}
    <div class="card-body"><div class="row g-3">
      {% for field in form %}<div class="col-12 col-md-6"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-hint">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endfor %}
    </div></div>
    <div class="card-footer text-end"><button class="btn btn-primary" type="submit">حفظ</button></div>
  </form>
{% endblock %}
