{% if page_obj.paginator.num_pages > 1 %}
  <nav class="mt-4" aria-label="صفحات النتائج">
    <ul class="pagination justify-content-center">
      <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">
        {% if page_obj.has_previous %}<a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">السابق</a>{% else %}<span class="page-link">السابق</span>{% endif %}
      </li>
      <li class="page-item active"><span class="page-link">{{ page_obj.number }} من {{ page_obj.paginator.num_pages }}</span></li>
      <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">
        {% if page_obj.has_next %}<a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}">التالي</a>{% else %}<span class="page-link">التالي</span>{% endif %}
      </li>
    </ul>
  </nav>
{% endif %}
