{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-4" aria-label="ترقيم الصفحات">
  <ul class="pagination justify-content-center">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}">السابق</a></li>{% endif %}
    <li class="page-item active"><span class="page-link">{{ page_obj.number }} من {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}">التالي</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
