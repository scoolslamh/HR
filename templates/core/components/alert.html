<div class="alert alert-{{ type|default:'info' }}{% if dismissible %} alert-dismissible{% endif %}" role="alert">
  <div class="d-flex">
    <div aria-hidden="true"><i data-lucide="{{ icon|default:'info' }}" class="alert-icon"></i></div>
    <div>
      {% if title %}<h2 class="alert-title h4">{{ title }}</h2>{% endif %}
      <div class="text-secondary">{{ message }}</div>
    </div>
  </div>
  {% if dismissible %}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="إغلاق"></button>{% endif %}
</div>
