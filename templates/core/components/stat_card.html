{% if url_name %}<a class="text-decoration-none" href="{% url url_name %}">{% endif %}
<article class="card stat-card stat-card-{{ color|default:'blue' }} h-100"{% if url_name %} aria-label="{{ title }}: {{ value }} — عرض التفاصيل"{% endif %}>
  <div class="card-body">
    <div class="d-flex align-items-center gap-3">
      <span class="avatar bg-{{ color|default:'primary' }}-lt text-{{ color|default:'primary' }}" aria-hidden="true">
        <i data-lucide="{{ icon|default:'chart-column' }}"></i>
      </span>
      <div class="flex-fill min-w-0">
        <div class="text-secondary text-truncate">{{ title }}</div>
        <div class="h2 mb-0 mt-1">{{ value }}</div>
      </div>
    </div>
    <div class="d-flex align-items-center justify-content-between gap-2 mt-3">
      {% if hint %}<span class="small text-secondary">{{ hint }}</span>{% endif %}
    </div>
  </div>
</article>
{% if url_name %}</a>{% endif %}
